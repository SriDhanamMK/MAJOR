server.port=8080
spring.application.name=ast-code-similarity-backend

# Parser Engine configuration
parser.engine.path=parser-engine/treesitter_parser.py
parser.python.executable=python
parser.timeout.ms=10000
parser.max.source.bytes=524288

# Logging
logging.level.com.ast.similarity=INFO
logging.level.org.springframework.web=WARN

# Jackson
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.indent-output=true
